name: Sync Stella Moderators

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-stella-moderators
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Sync moderator snapshot
        id: sync
        env:
          STELLA_TOKEN: ${{ secrets.STELLA_TOKEN }}
        run: python3 scripts/sync_moderators.py

      - name: Commit updated snapshot
        if: steps.sync.outputs.changed == 'true'
        env:
          ADDED: ${{ steps.sync.outputs.added }}
          REMOVED: ${{ steps.sync.outputs.removed }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/moderators.json data/moderator_changes.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "moderators: sync (+${ADDED} -${REMOVED})"
          git push
